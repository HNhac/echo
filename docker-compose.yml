services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      HOST_STATS_FILE: /app/var/host-stats.json
    volumes:
      - echo-data:/app/apps/api/data
      - ./var:/app/var:ro
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_API_URL: /echo-api
        NEXT_PUBLIC_SITE_URL: https://echothuvui.vn
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /echo-api
      NEXT_PUBLIC_SITE_URL: https://echothuvui.vn
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  cms:
    build:
      context: .
      dockerfile: deploy/Dockerfile.cms
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_API_URL: /echo-api
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /echo-api
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  echo-data:
